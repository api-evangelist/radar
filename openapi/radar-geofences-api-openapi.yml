openapi: 3.2.0
info:
  title: Radar Geofences API
  description: Use Radar APIs as building blocks for location-based products and services like pickup and delivery tracking, location-triggered notifications, location verification, store locators, address autocomplete, and more. Or, use Radar APIs to manage your Radar data, including users, geofences, and events.
  version: '1.0'
  contact:
    name: Radar
    url: https://radar.com/documentation/api
servers:
- url: https://api.radar.io/v1
  description: Radar production API
security:
- ApiKeyAuth: []
tags:
- name: Geofences
  description: Manage geographic boundaries
paths:
  /geofences:
    get:
      tags:
      - Geofences
      summary: List geofences
      responses:
        '200':
          description: List of geofences
      operationId: getGeofences
      x-operation-id-source: derived
    post:
      tags:
      - Geofences
      summary: Create a geofence
      responses:
        '200':
          description: Created geofence
      operationId: postGeofences
      x-operation-id-source: derived
  /geofences/{geofenceId}:
    get:
      tags:
      - Geofences
      summary: Retrieve a geofence
      parameters:
      - name: geofenceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Geofence
      operationId: getGeofencesByGeofenceId
      x-operation-id-source: derived
    put:
      tags:
      - Geofences
      summary: Update a geofence
      parameters:
      - name: geofenceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated geofence
      operationId: putGeofencesByGeofenceId
      x-operation-id-source: derived
    delete:
      tags:
      - Geofences
      summary: Delete a geofence
      parameters:
      - name: geofenceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
      operationId: deleteGeofencesByGeofenceId
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
